[versions]
morphe-patcher = "2.6.0"
morphe-patches-library = "2.3.0"
#noinspection GradleDependency
smali = "5a5249e22f"
gson = "2.15.0"
animalsniffer = "2.0.1"
gummy-bears = "0.16.0"
junit-jupiter = "5.11.4"
junit-platform = "1.11.4"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
android-api-signature = { module = "com.toasttab.android:gummy-bears-api-26", version.ref = "gummy-bears" }
morphe-patches-library = { module = "app.morphe:morphe-patches-library", version.ref = "morphe-patches-library" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
# Gradle plugins adds the dependency during build, this declaration is here only for dependabot to provide updates.
#noinspection UnusedVersionCatalogEntry
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }

[plugins]
animalsniffer = { id = "ru.vyarus.animalsniffer", version.ref = "animalsniffer" }
