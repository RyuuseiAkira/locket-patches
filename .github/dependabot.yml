version: 2
updates:
  - package-ecosystem: github-actions
    labels: []
    directory: /
    target-branch: dev
    schedule:
      interval: monthly

  - package-ecosystem: npm
    labels: []
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      # version 10.x and later may not generate release notes correctly
      # https://github.com/conventional-changelog/conventional-changelog/issues/1495
      - dependency-name: "conventional-changelog-conventionalcommits"
      # gradle-semantic-release-plugin 1.10.3 declares peer dependency semantic-release "^24.0.0 || ^25.0.0"
      - dependency-name: "semantic-release"
        versions:
          - ">= 26.0.0"

  - package-ecosystem: gradle
    labels: []
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
